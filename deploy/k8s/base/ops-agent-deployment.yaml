apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-agent
  namespace: demo
  labels:
    app.kubernetes.io/name: ops-agent
    app.kubernetes.io/component: a2a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-agent
        app.kubernetes.io/component: a2a
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8202"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-sundae-mcp
          image: sundae-funday/sundae-mcp:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import time
              import urllib.error
              import urllib.request

              url = "http://sundae-mcp:8101/healthz"
              for attempt in range(60):
                  try:
                      with urllib.request.urlopen(url, timeout=2) as response:
                          if response.status == 200:
                              raise SystemExit(0)
                  except (TimeoutError, urllib.error.URLError):
                      if attempt == 59:
                          raise
                      time.sleep(2)
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      containers:
        - name: ops-agent
          image: sundae-funday/ops-agent:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: SERVICE
              value: ops-agent
            - name: PORT
              value: "8202"
          ports:
            - name: http
              containerPort: 8202
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
