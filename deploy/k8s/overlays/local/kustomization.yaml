apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - loki-deployment.yaml
  - loki-service.yaml
  - tempo-deployment.yaml
  - tempo-service.yaml
  - grafana-deployment.yaml
  - grafana-service.yaml
  - grafana-datasources-configmap.yaml
patches:
  # Patch env vars for local dev (Ollama, OTLP)
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: app-config
  - path: patch-secret.yaml
    target:
      kind: Secret
      name: app-secrets
  # Enable hostNetwork so concierge can reach Ollama on the host
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: concierge
images:
  - name: sundae-funday/sundae-mcp
    newName: sundae-funday/sundae-mcp
    newTag: 0.1.0
  - name: sundae-funday/ops-agent
    newName: sundae-funday/ops-agent
    newTag: 0.1.0
  - name: sundae-funday/concierge
    newName: sundae-funday/concierge
    newTag: 0.1.0
  - name: grafana/grafana
    newName: grafana/grafana
    newTag: 11.5.0
  - name: grafana/loki
    newName: grafana/loki
    newTag: 3.3.2
  - name: grafana/tempo
    newName: grafana/tempo
    newTag: 2.6.0
