image:
  registry: ghcr.io/pauldotyu
  repository: sundae-funday
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

configMap:
  name: app-config

config:
  LOG_LEVEL: INFO
  ENABLE_INSTRUMENTATION: "true"
  OTEL_SERVICE_NAMESPACE: demo
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OPENAI_BASE_URL: ""
  OPENAI_CHAT_MODEL: ""
  OPENAI_AUTH_MODE: api_key
  SUNDAE_MCP_URL: http://sundae-mcp:8101/mcp/
  OPS_AGENT_URL: http://ops-agent:8202
  OPS_AGENT_PUBLIC_BASE_URL: http://ops-agent:8202

secret:
  create: true
  name: app-secrets
  existingSecret: ""
  data:
    APPLICATIONINSIGHTS_CONNECTION_STRING: ""
    OPENAI_API_KEY: ""

workloadIdentity:
  enabled: false
  clientId: ""
  serviceAccount:
    create: true
    name: demo

components:
  sundaeMcp:
    name: sundae-mcp
    component: mcp
    replicas: 1
    port: 8101
    service:
      type: ClusterIP
      port: 8101
    startupFailureThreshold: 12
    workloadIdentity: false
    hostNetwork: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  opsAgent:
    name: ops-agent
    component: a2a
    replicas: 1
    port: 8202
    service:
      type: ClusterIP
      port: 8202
    startupFailureThreshold: 27
    workloadIdentity: true
    hostNetwork: false
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
  concierge:
    name: concierge
    component: web
    replicas: 1
    port: 8301
    service:
      type: LoadBalancer
      port: 80
    startupFailureThreshold: 18
    workloadIdentity: true
    hostNetwork: false
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
