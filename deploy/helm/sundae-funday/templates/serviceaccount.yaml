{{- if and .Values.workloadIdentity.enabled .Values.workloadIdentity.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sundae-funday.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sundae-funday.labels" . | nindent 4 }}
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required when workload identity is enabled" .Values.workloadIdentity.clientId | quote }}
{{- end }}
