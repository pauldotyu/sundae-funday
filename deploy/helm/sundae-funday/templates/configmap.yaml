apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sundae-funday.labels" . | nindent 4 }}
    app.kubernetes.io/name: sundae-funday
    app.kubernetes.io/component: config
data:
  APP_VERSION: {{ include "sundae-funday.version" . | quote }}
  FOUNDRY_WORKLOAD_IDENTITY_CLIENT_ID: {{ default (index .Values.config "FOUNDRY_WORKLOAD_IDENTITY_CLIENT_ID") .Values.workloadIdentity.clientId | quote }}
  {{- range $name, $value := .Values.config }}
  {{- if ne $name "FOUNDRY_WORKLOAD_IDENTITY_CLIENT_ID" }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
