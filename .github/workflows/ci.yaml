name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "value=0.1.0-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make check
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/sundae-funday
      - run: helm template sundae-funday deploy/helm/sundae-funday --namespace demo

  container-build:
    needs: [checks, version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [sundae-mcp, ops-agent, concierge]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sundae-funday-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.version.outputs.value }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            SERVICE=${{ matrix.service }}

  helm-publish:
    if: github.event_name == 'push'
    needs: [checks, version, container-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin
      - name: Package chart
        run: |
          helm package deploy/helm/sundae-funday \
            --destination dist \
            --version "${{ needs.version.outputs.value }}" \
            --app-version "${{ needs.version.outputs.value }}"
      - name: Push chart
        run: |
          helm push \
            "dist/sundae-funday-${{ needs.version.outputs.value }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
