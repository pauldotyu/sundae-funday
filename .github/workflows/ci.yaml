name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          base="$(
            python3 -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$base" ]]; then
              echo "::error::Tag version ${version} does not match project version ${base}"
              exit 1
            fi
          else
            short_sha="$(git rev-parse --short=7 HEAD)"
            version="${base}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.g${short_sha}"
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make check
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/sundae-funday
      - run: helm template sundae-funday deploy/helm/sundae-funday --namespace demo
      - run: >-
          helm template sundae-funday deploy/helm/sundae-funday
          --namespace demo --values deploy/helm/values-local.yaml
      - run: >-
          helm template sundae-funday deploy/helm/sundae-funday
          --namespace demo --values deploy/helm/values-azure.yaml

  container-build:
    needs: [checks, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sundae-funday
          tags: |
            type=raw,value=${{ needs.version.outputs.value }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  helm-publish:
    if: github.event_name == 'push'
    needs: [checks, version, container-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin
      - name: Package chart
        env:
          FULL_VERSION: ${{ needs.version.outputs.value }}
        run: |
          helm package deploy/helm/sundae-funday \
            --destination dist \
            --version "${FULL_VERSION}" \
            --app-version "${FULL_VERSION}"
      - name: Verify packaged chart version
        env:
          FULL_VERSION: ${{ needs.version.outputs.value }}
        run: |
          chart="dist/sundae-funday-${FULL_VERSION}.tgz"
          helm show chart "${chart}" | grep -Fxq "version: ${FULL_VERSION}"
          helm show chart "${chart}" | grep -Fxq "appVersion: ${FULL_VERSION}"
          test "$(
            helm template sundae-funday "${chart}" --namespace demo |
              grep -Fc "image: \"ghcr.io/pauldotyu/sundae-funday:${FULL_VERSION}\""
          )" -eq 3
      - name: Push chart
        run: |
          helm push \
            "dist/sundae-funday-${{ needs.version.outputs.value }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
