[project]
name = "sundae-funday"
version = "0.1.0"
description = "Slim MCP and A2A sundae demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "a2a-sdk>=1.1,<2",
  "agent-framework-a2a>=1.0.0b260730,<2",
  "agent-framework-core>=1.13,<2",
  "agent-framework-openai>=1.13,<2",
  "azure-identity>=1.25,<2",
  "azure-monitor-opentelemetry-exporter>=1.0.0b50,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=1.29,<2",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-instrumentation-asgi>=0.57b0,<1",
  "opentelemetry-instrumentation-httpx>=0.57b0,<1",
  "opentelemetry-sdk>=1.36,<2",
  "prometheus-client>=0.23,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "starlette>=0.47,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
sundae-funday-serve = "sundae_funday.run_service:main"
sundae-funday-healthcheck = "sundae_funday.healthcheck:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sundae_funday"]

[dependency-groups]
dev = [
  "pyright>=1.1,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = [
  "ignore::pydantic.warnings.PydanticDeprecatedSince20",
  "ignore:Field 'lifespan' has an incomplete definition:UserWarning",
  "ignore:`LoggingHandler` in `opentelemetry-sdk` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
exclude = ["**/__pycache__"]
reportMissingTypeStubs = false
